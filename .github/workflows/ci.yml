name: CI
# t79 (SEC-010): run the same gates agents run locally, on every PR and on
# pushes to main. (Branch protection requiring this check stays an owner
# setting in GitHub — see DOC-ANALYSIS-t79.)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:src
